<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>{% block titulo %}Hábitos{% endblock %} · Habit Tracker</title>
  <link rel="manifest" href="{{ url_for('rutas.manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="contenedor">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="aviso aviso-{{ categoria }}" role="status">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>

  {% set ep = request.endpoint %}
  <nav class="barra" aria-label="Navegación principal">
    <a href="{{ url_for('rutas.hoy') }}" {% if ep == 'rutas.hoy' %}aria-current="page"{% endif %}><span>✓</span>Hoy</a>
    <a href="{{ url_for('rutas.habitos') }}" {% if ep in ('rutas.habitos', 'rutas.detalle', 'rutas.editar') %}aria-current="page"{% endif %}><span>☰</span>Hábitos</a>
    <a href="{{ url_for('rutas.nuevo') }}" {% if ep == 'rutas.nuevo' %}aria-current="page"{% endif %}><span>＋</span>Nuevo</a>
    <a href="{{ url_for('rutas.estadisticas') }}" {% if ep == 'rutas.estadisticas' %}aria-current="page"{% endif %}><span>▥</span>Estadísticas</a>
  </nav>
</body>
</html>
